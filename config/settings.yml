# Real Deal Finder settings
# Lines starting with # are notes and are ignored.
# After you change this file, the next daily check uses the new settings.

# How far below its normal price something must be to count as a "Real deal".
real_deal_threshold_percent: 15

# The web address of your deals page (filled in once the page is turned on).
site_url: "https://nevadaocull.github.io/real-deal-finder/"

# What you're interested in. Each name has a list of searches.
# A deal shows up when its title contains one of the searches as a phrase
# (whole words, in that order; plurals count, so "coilover" also finds "coilovers").
interests:
  Drift parts:
    # 1979-2004 Mustang
    - sn95
    - fox body
    - new edge mustang
    - mustang 4.6
    - mustang gt
    # drift parts
    - coilover
    - bucket seat
    - racing seat
    - hydraulic handbrake
    - steering angle kit
    - torque arm
    - panhard
    - subframe connector
    - racing harness
  Tools:
    - milwaukee
    - dewalt
    - impact driver
    - socket set

# Store sale sections to watch (Shopify stores like DriftHQ and FDF Raceshop).
# "only" limits a section to items whose titles contain one of these words.
# Leave "only" out to see every item in the section.
shop_sections:
  - url: https://drifthq.com/collections/garage-sale
    only: [mustang, ford, sn95, fox body, new edge, universal, bucket seat,
           racing seat, hydraulic handbrake, torque arm, panhard,
           subframe connector, harness]

# Specific items to watch. Paste the product link.
# target_price is optional: you get an email when the price drops to it or below.
# Example:
#   - url: https://www.amazon.com/dp/B00KCF7JL6
#     target_price: 150
watchlist: []
